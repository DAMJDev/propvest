    <!-- ── SERVICE WORKER REGISTRATION ── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js', {
              scope: '/'
            });
            console.log('[PDD] Service worker registered:', reg.scope);

            // Check for updates
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available — show update prompt
                  if (window.__pddShowUpdate) window.__pddShowUpdate();
                }
              });
            });
          } catch (err) {
            console.warn('[PDD] SW registration failed:', err);
          }
        });
      }

      // ── INSTALL PROMPT ──────────────────────────────────────────
      let deferredInstallPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        // Store for app to use
        window.__pddInstallPrompt = e;
        // Dispatch event so React can show install button
        window.dispatchEvent(new CustomEvent('pdd-install-ready'));
        console.log('[PDD] App install prompt ready');
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        window.__pddInstallPrompt = null;
        console.log('[PDD] App installed successfully');
        window.dispatchEvent(new CustomEvent('pdd-installed'));
      });

      // ── STARTUP ROUTE HANDLING ──────────────────────────────────
      // Read ?page= param on launch (from manifest shortcuts)
      const urlParams = new URLSearchParams(window.location.search);
      const startPage = urlParams.get('page');
      window.__pddParams = { token: urlParams.get('token'), id: urlParams.get('id') };
      if (startPage) {
        window.__pddStartPage = startPage;
        // Clean URL without reloading
        window.history.replaceState({}, '', '/');
      }
    </script>
